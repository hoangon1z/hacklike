services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c timezone=Asia/Ho_Chi_Minh
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1
    shm_size: 256m
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      LOG_LEVEL: warning
      LOG_HTML: "false"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  provider-transport:
    build: ./deploy/provider-transport
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SMM_TRANSPORT_TOKEN: ${SMM_TRANSPORT_TOKEN:?Set SMM_TRANSPORT_TOKEN in .env.production}
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    depends_on:
      flaresolverr: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8192/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 4000
      SMM_PROVIDER_TRANSPORT_URL: http://provider-transport:8192/v1
      SMM_TRANSPORT_TOKEN: ${SMM_TRANSPORT_TOKEN:?Set SMM_TRANSPORT_TOKEN in .env.production}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      provider-transport: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports: ["80:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
