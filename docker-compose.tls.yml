services:
  web:
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ./deploy/nginx.tls.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/hacklike43/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
